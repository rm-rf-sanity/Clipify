name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: Clipify-Windows-x64
          path: release/Clipify-*-win-x64.exe
          if-no-files-found: error
